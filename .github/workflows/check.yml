name: Dokumentation prüfen
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        base: ["/SVWS-Team/", "/"]
    env:
      BASE: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - name: Schulungswerkzeuge prüfen
        if: matrix.base != '/'
        run: python3 scripts/check-training-scripts.py
